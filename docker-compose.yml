services:
  mongo:
    image: ${MONGO_IMAGE}
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - mongo_data:/data/db

  rabbitmq:
    image: ${RABBITMQ_IMAGE}
    restart: unless-stopped
    ports:
      - '${RABBITMQ_MANAGEMENT_HOST_PORT}:${RABBITMQ_MANAGEMENT_CONTAINER_PORT}'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  minio:
    image: ${MINIO_IMAGE}
    restart: unless-stopped
    command: server ${MINIO_DATA_DIR} --console-address ":${MINIO_CONSOLE_CONTAINER_PORT}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - '${MINIO_CONSOLE_HOST_PORT}:${MINIO_CONSOLE_CONTAINER_PORT}'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - minio_data:${MINIO_DATA_DIR}

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      PORT: ${PORT}
      MONGO_URI: ${MONGO_URI}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: ${MINIO_PORT}
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      RABBITMQ_ASSET_QUEUE: ${RABBITMQ_ASSET_QUEUE}
      MAX_FILE_SIZE_BYTES: ${MAX_FILE_SIZE_BYTES}
      UPLOAD_TMP_DIR: ${UPLOAD_TMP_DIR}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE: ${JWT_EXPIRE}
    expose:
      - '${PORT}'

  nginx:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - '${NGINX_HOST_PORT}:${NGINX_CONTAINER_PORT}'

volumes:
  mongo_data:
  rabbitmq_data:
  minio_data:
